 const full=o.L.every(l=>l.r>=l.q), any=o.L.some(l=>l.r>0);
 if(full)return{k:'rebut',t:'Rebut',c:'grn'};
 if(any)return{k:'parcial',t:'Parcial',c:'amb'};
 if(!o.cd&&days(TODAY,o.pd)>0)return{k:'critica',t:'Venç sense confirmar',c:'red'};
 if(!o.cd)return{k:'confirmar',t:'Sense confirmar',c:'amb'};
 if(days(o.cd,o.pd)>0)return{k:'retard',t:'Retard +'+days(o.cd,o.pd)+' d',c:'red'};
 return{k:'termini',t:'En termini',c:'blu'};
}
const qty=o=>o.L.reduce((a,l)=>a+l.q,0),rec=o=>o.L.reduce((a,l)=>a+l.r,0);
const state={route:'bustia',f:'tots',q:'',a:'tots',buyer:'tots',mailKind:'all'};
let actions={};try{actions=JSON.parse(localStorage.getItem('daunis-demo-v3')||'{}')}catch{};
function saveActions(){try{localStorage.setItem('daunis-demo-v3',JSON.stringify(actions))}catch{}}
function snoozed(o){return (actions['snooze:'+o.id]||0)>Date.now()}
function resetDemo(){actions={};saveActions();render()}

function nav(){
 const n=flagged().length,nb=MAIL.filter(m=>!actions[m.id]).length;
 const h=(m)=>NAV.map(([k,t])=>`<a data-r="${k}" class="${state.route===k?'on':''}">${m?MOBN[k]:t}${k==='excepcions'?`<span class="n">${n}</span>`:''}${k==='bustia'&&!m?`<span class="n">${nb}</span>`:''}</a>`).join('');
 document.getElementById('side').innerHTML=`<div class="brand"><img src="${LOGO}" alt="Daunis"><small>COMPRES · SEGUIMENT DE COMANDES</small></div><div class="sep"></div>${h(false)}<div class="sync"><i></i>Lectura de comandes d'ERP<br>Darrera sincronització: 13/11 08:55<br><span style="opacity:.8">(simulada)</span><br><button class="chip" style="margin-top:10px" onclick="resetDemo()">Reinicia la demo</button></div>`;
 document.getElementById('mob').innerHTML=h(true);
 document.querySelectorAll('[data-r]').forEach(a=>a.onclick=()=>go(a.dataset.r));
}
function go(r,f){state.route=r;if(f)state.f=f;location.hash=r;render();window.scrollTo(0,0)}
const tag=o=>{const s=st(o);return`<span class="tag t-${s.c}">${s.t}</span>`};
const head=(t,s)=>`<div class="context">Compres / ${t}<span>Magatzem central · Terrassa · 13 nov 2026</span></div><header class="top"><h1>${t}</h1><div class="sub">${s}</div></header>`;
function inici(){
 const c=k=>O.filter(o=>st(o).k===k).length;
 const lines=O.reduce((a,o)=>a+o.L.filter(l=>l.r<l.q).length,0);
 const top=urgent().filter(o=>!snoozed(o)).slice(0,4).map(o=>`<div class="ex" style="cursor:pointer" data-o="${o.id}"><span class="dot d-red"></span><div class="b"><b>${o.id}</b> · ${SUP[o.s].n}<div class="small mut">${o.L[0].d}${o.L.length>1?' +'+(o.L.length-1):''} · ${o.imp}</div></div>${tag(o)}</div>`).join('');
 const bars=Object.entries(SUP).sort((a,b)=>a[1].ok-b[1].ok).slice(0,5).map(([k,s])=>`<div style="margin:9px 0"><div style="display:flex;justify-content:space-between"><span>${s.n}</span><b>${s.ok}%</b></div><div class="bar"><i style="width:${s.ok}%"></i></div></div>`).join('');
 return head('Resum de compres','Divendres 13/11/2026 · '+O.length+' comandes de mostra · '+lines+' línies pendents de rebre')+`
 <div class="grid k4">
 <div class="card kpi bad" onclick="go('comandes','critica')"><b>${c('critica')}</b><span>Vençudes sense confirmar</span></div>
 <div class="card kpi bad" onclick="go('comandes','retard')"><b>${c('retard')}</b><span>Data més tardana que la promesa</span></div>
 <div class="card kpi warn" onclick="go('comandes','parcial')"><b>${c('parcial')}</b><span>Entregues parcials</span></div>
 <div class="card kpi warn" onclick="go('bustia')"><b>${MAIL.filter(m=>!actions[m.id]).length}</b><span>Correus de proveïdors amb diferències</span></div></div>
 <div class="grid two" style="margin-top:14px">
 <div class="card"><h2>Cal actuar avui</h2>${top}<button class="btn ghost" style="margin-top:10px" onclick="go('excepcions')">Veure totes les excepcions</button></div>
 <div class="card"><h2>Puntualitat de proveïdors (mostra)</h2>${bars}<div class="small mut">% de línies rebudes dins la data promesa, últims 90 dies. Dada fictícia.</div></div></div>
 <div class="card" style="margin-top:14px"><h2>Com funciona</h2><div class="small">1) Es llegeixen les comandes de l'ERP. 2) Es llegeixen les confirmacions, albarans i avisos dels proveïdors per correu. 3) Es comparen amb la comanda (data, quantitat, preu). 4) Només es mostra el que s'ha desviat, amb la reclamació redactada. El comprador revisa i decideix; res s'envia sol.</div></div>`;
}
function comandes(){
 const fl=[['tots','Totes'],['critica','Venç sense confirmar'],['retard','Retard'],['parcial','Parcial'],['confirmar','Sense confirmar'],['termini','En termini'],['rebut','Rebudes']];
 const rows=O.filter(o=>(state.f==='tots'||st(o).k===state.f)&&(state.buyer==='tots'||SUP[o.s].c===state.buyer)&&(state.a==='tots'||SUP[o.s].a===state.a)&&(state.q===''||(o.id+o.L.map(l=>l.d+l.ref).join()+SUP[o.s].n).toLowerCase().includes(state.q.toLowerCase())));
 const tb=rows.map(o=>`<tr class="row" data-o="${o.id}"><td><b>${o.id}</b><div class="small mut">${o.L[0].d}${o.L.length>1?' +'+(o.L.length-1)+' línia':''}</div></td><td class="hide-m">${SUP[o.s].n}<div class="small mut">${SUP[o.s].c}</div></td><td class="hide-m">${rec(o)}/${qty(o)}</td><td>${fmt(o.pd)}${o.cd&&o.cd!==o.pd?`<div class="small mut">nova: ${fmt(o.cd)}</div>`:''}</td><td>${tag(o)}</td></tr>`).join('')||`<tr><td colspan="5" class="mut">Cap comanda amb aquest filtre.</td></tr>`;
 return head('Comandes a proveïdors','Toca una comanda per veure línies, cronologia i reclamació')+`
 <div class="tools"><input type="search" id="q" placeholder="Cerca per comanda, referència, article o proveïdor" value="${state.q}">
 <select id="buyer"><option value="tots">Tots els compradors (demo)</option>${[...new Set(Object.values(SUP).map(p=>p.c))].map(n=>`<option ${state.buyer===n?'selected':''}>${n}</option>`).join('')}</select><select id="ar"><option value="tots">Totes les àrees</option><option ${state.a==='Industrial'?'selected':''}>Industrial</option><option ${state.a==='Instal·ladors'?'selected':''}>Instal·ladors</option></select></div>
 <div class="tools">${fl.map(([k,t])=>`<button class="chip ${state.f===k?'on':''}" data-f="${k}">${t}</button>`).join('')}</div>
 <div class="card tw"><table><thead><tr><th>Comanda</th><th class="hide-m">Proveïdor</th><th class="hide-m">Rebut</th><th>Data</th><th>Estat</th></tr></thead><tbody>${tb}</tbody></table>
 <div class="small mut" style="margin-top:8px">${rows.length} de ${O.length} comandes</div></div>`;
}
function linies(){
 const rows=[];O.forEach(o=>o.L.forEach(l=>{if(l.r<l.q){const eff=o.cd||o.pd;rows.push({o,l,late:days(TODAY,eff),eff})}}));
 rows.sort((a,b)=>b.late-a.late);
 const tb=rows.map(({o,l,late,eff})=>`<tr class="row" data-o="${o.id}"><td><span class="mono">${l.ref}</span><div>${l.d}</div><div class="small mut">${o.id} · ${SUP[o.s].n}</div></td><td>${l.q-l.r}<span class="mut small"> de ${l.q}</span></td><td>${fmt(eff)}<div class="small ${late>0?'':'mut'}" style="${late>0?'color:#b42318':''}">${late>0?late+' d de retard':(late===0?'avui':'d\'aquí a '+(-late)+' d')}</div></td><td class="hide-m">${o.imp}</td></tr>`).join('');
 return head('Línies pendents','Per article, ordenades per retard. És la llista de treball diària del comprador.')+`<div class="card tw"><table><thead><tr><th>Article</th><th>Falten</th><th>Data efectiva</th><th class="hide-m">Impacte</th></tr></thead><tbody>${tb}</tbody></table></div>`;
}
function reviewMail(id){const m=MAIL.find(x=>x.id===id);document.getElementById('pn').innerHTML=`<button class="x" id="cl">×</button><h2>${m.subj}</h2><div class="mut small">De: ${m.from}<br>Rebut: ${m.when} · mostra fictícia</div><h3>Correu del proveïdor</h3><p>${m.body}</p><h3>Diferències amb la comanda</h3><div class="diff">${m.diff.join('<br>')}</div><h3>Decisió del comprador</h3><p class="small mut">Revisa el canvi abans d'aplicar-lo. Aquesta demo només actualitza la cua local, mai l'ERP.</p><div class="act"><button class="btn" onclick="actions['${m.id}']=true;saveActions();closeD();render()">Marca revisat (demo)</button><button class="btn ghost" onclick="openO('${m.o}')">Veure línies de comanda</button></div>`;document.getElementById('dr').classList.add('on');document.getElementById('cl').onclick=closeD}
function bulkReview(){document.querySelectorAll('[data-pick]:checked').forEach(e=>actions[e.dataset.pick]=true);saveActions();render()}
function bustia(){
 const k={date:'Data',price:'Preu + data',qty:'Quantitat'};
 const all=MAIL.filter(m=>!actions[m.id]);const rows=all.filter(m=>state.mailKind==='all'||m.kind===state.mailKind);
 return head('Confirmacions de proveïdors',"Revisa canvis de data, quantitat i preu abans d'actualitzar la comanda.")+`<div class="tabs">${[['all','Pendents de revisió',all.length],['date','Dates',all.filter(m=>m.kind==='date').length],['price','Preus',all.filter(m=>m.kind==='price').length],['qty','Quantitats',all.filter(m=>m.kind==='qty').length]].map(([v,t,n])=>`<button class="tab ${state.mailKind===v?'on':''}" data-mk="${v}">${t} <b>${n}</b></button>`).join('')}</div>
 <div class="card work"><div class="toolbar"><input type="checkbox" id="pick-all" aria-label="Selecciona totes les files"><button class="btn ghost" id="bulk">Marca revisades</button><span class="mut">Acció local · no escriu a l'ERP</span></div><div class="tw"><table><thead><tr><th style="width:25px"></th><th>Comanda / proveïdor</th><th class="hide-m">Comprador</th><th>Canvi detectat</th><th class="hide-m">Rebut</th><th>Acció</th></tr></thead><tbody>${rows.map(m=>{const o=O.find(o=>o.id===m.o);return `<tr><td><input type="checkbox" data-pick="${m.id}" aria-label="Selecciona ${m.o}"></td><td><a href="#" data-o="${m.o}" style="font-weight:600;color:var(--navy)">${m.o}</a><div class="small">${SUP[o.s].n}</div><div class="small mut mobile-hide">${o.L[0].ref} · ${o.L[0].d}</div></td><td class="hide-m">${SUP[o.s].c}</td><td><span class="tag t-amb">${k[m.kind]}</span><div class="diff">${m.diff.filter(x=>!x.includes('Idioma')).join('<br>')}</div></td><td class="hide-m nowrap">${m.when}</td><td><div class="act"><button class="btn ghost" data-rm="${m.id}">Revisar</button><button class="btn ghost" data-o="${m.o}">Comanda</button></div></td></tr>`}).join('')||'<tr><td colspan="6" class="mut">No hi ha canvis pendents amb aquest filtre.</td></tr>'}</tbody></table></div><div class="foot">${rows.length} confirmacions · Origen: correu de proveïdor (simulat) · Les decisions queden al navegador.</div></div>`;
}
function excepcions(){const rows=flagged();return head('Excepcions de compra','Comandes pendents de resposta o amb desviacions detectades.')+`<div class="card work tw"><table><thead><tr><th>Comanda / proveïdor</th><th>Estat</th><th class="hide-m">Comprador</th><th class="hide-m">Impacte</th><th>Acció</th></tr></thead><tbody>${rows.map(o=>`<tr><td><b>${o.id}</b><div class="small mut">${SUP[o.s].n}</div></td><td>${tag(o)}</td><td class="hide-m">${SUP[o.s].c}</td><td class="hide-m small">${o.imp}</td><td><div class="act"><button class="btn ghost" data-o="${o.id}">Reclamar</button><button class="btn ghost" data-snooze="${o.id}">Ajorna 24 h</button></div></td></tr>`).join('')}</tbody></table><div class="foot">${rows.length} excepcions obertes · Ajorna només afecta la cua local de demostració.</div></div>`}
function proveidors(){
 const rows=Object.values(SUP).sort((a,b)=>a.ok-b.ok).map(s=>{const n=O.filter(o=>SUP[o.s]===s).length;return`<tr><td><b>${s.n}</b><div class="small mut">${s.cat} · ${s.a}</div></td><td class="hide-m">${s.c}</td><td>${s.lt} d</td><td><span style="font-weight:700">${s.ok}%</span><div class="bar" style="width:80px"><i style="width:${s.ok}%"></i></div></td><td class="hide-m">${O.filter(o=>SUP[o.s]===s&&st(o).k!=='rebut').length}</td></tr>`}).join('');
 return head('Proveïdors','Termini i puntualitat de mostra · proveïdors ficticis')+`<div class="card tw"><table><thead><tr><th>Proveïdor</th><th class="hide-m">Comprador</th><th>Termini</th><th>Puntualitat</th><th class="hide-m">Obertes</th></tr></thead><tbody>${rows}</tbody></table><div class="small mut" style="margin-top:8px">Dades fictícies. Amb dades reals, el termini que es promet als clients es corregeix amb la mitjana real de cada proveïdor.</div></div>`;
}
function draft(o){
 const s=st(o),pend=o.L.filter(l=>l.r<l.q);const lst=pend.map(l=>`- ${l.ref} · ${l.d}: ${l.q-l.r} u.`).join('\n');
 if(s.k==='parcial')return`Bon dia,\n\nDe la comanda ${o.id} hem rebut una part del material. Encara ens falta:\n${lst}\n\nEns podeu confirmar quan arribarà i el motiu de la diferència?\n\nGràcies,\n[Nom del comprador]`;
 if(s.k==='retard')return`Bon dia,\n\nLa comanda ${o.id} tenia data de lliurament ${fmt(o.pd)} i ara ens indiqueu ${fmt(o.cd)}. Tenim comandes de client pendents d'aquest material:\n${lst}\n\nHi ha alguna opció d'avançar-ne una part o d'enviar-ho per parcials?\n\nGràcies,\n[Nom del comprador]`;
 return`Bon dia,\n\nNo tenim confirmació de la comanda ${o.id} i la data prevista era ${fmt(o.pd)}:\n${lst}\n\nEns podeu confirmar la data de lliurament?\n\nGràcies,\n[Nom del comprador]`;

function saveReceipt(id){const doc=document.getElementById('r-doc').value.trim();const o=O.find(o=>o.id===id);const rows=[...document.querySelectorAll('[data-rqty]')].map(e=>({line:e.dataset.rqty,qty:Number(e.value)}));if(!doc)return document.getElementById('r-error').textContent='Indica el número d\'albarà.';if(rows.some(r=>!Number.isInteger(r.qty)||r.qty<0||r.qty>o.L.find(l=>l.key===r.line).q-o.L.find(l=>l.key===r.line).r))return document.getElementById('r-error').textContent='La quantitat ha de ser entera i no pot superar el pendent.';if(!rows.some(r=>r.qty>0))return document.getElementById('r-error').textContent='Indica almenys una quantitat rebuda.';rows.filter(r=>r.qty>0).forEach(r=>db.receipts.push({...r,o:id,doc,date:'2026-11-13',note:document.getElementById('r-note').value}));audit(`Recepció ${doc} registrada (mostra)`,id);applyDb();closeD();render();toast('Recepció desada. Línies pendents actualitzades.')}

proveidors=function(){return head('Proveïdors','Relació de compres, terminis, puntualitat i comandes pendents.')+`<div class="card work"><div class="toolbar"><b>${Object.keys(SUP).length} proveïdors de mostra</b><span class="mut">Puntualitat històrica fictícia · 90 dies</span></div><div class="table-scroll"><table><thead><tr><th>Proveïdor</th><th>Àrea / família</th><th>Comprador</th><th>Termini</th><th>Puntualitat</th><th>Obertes</th><th class="num">Import pendent</th><th></th></tr></thead><tbody>${Object.entries(SUP).sort((a,b)=>a[1].ok-b[1].ok).map(([id,p])=>{const os=O.filter(o=>o.s===id);return `<tr><td><button class="text-btn" onclick="supplier('${id}')">${p.n}</button><small>${id} · Proveïdor fictici</small></td><td>${p.a}<small>${p.cat}</small></td><td>${p.c}</td><td>${p.lt} dies</td><td><span class="${p.ok<70?'red':''}"><b>${p.ok}%</b></span><div class="bar" style="width:90px"><i style="width:${p.ok}%"></i></div></td><td>${os.filter(o=>st(o).k!=='rebut').length}</td><td class="num">${euro(os.reduce((a,o)=>a+openAmount(o),0))}</td><td><button class="btn ghost" onclick="supplier('${id}')">Fitxa</button></td></tr>`}).join('')}</tbody></table></div></div>`};
function donut(data){const total=data.reduce((a,d)=>a+d.n,0)||1;let start=0;const colors=['#172c65','#3d78b9','#df9436','#dc5654','#5a9b7b'];return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${data.map((d,i)=>{const a=start;start+=100*d.n/total;return colors[i%colors.length]+' '+a+'% '+start+'%'}).join(',')})"><div><b>${pendingLines().length}</b><small>línies pendents</small></div></div><div>${data.map((d,i)=>`<div class="legend"><i style="background:${colors[i%colors.length]}"></i>${d.t}<b>${d.n}</b></div>`).join('')}</div></div>`}
function informes(){const pending=pendingLines(),amount=pending.reduce((a,x)=>a+x.amount,0);const data=[{t:'En termini',n:pending.filter(x=>x.o.cd&&x.late===0&&days(x.o.cd,x.o.pd)<=0).length},{t:'Data modificada',n:pending.filter(x=>x.o.cd&&x.late===0&&days(x.o.cd,x.o.pd)>0).length},{t:'Sense confirmar',n:pending.filter(x=>!x.o.cd).length},{t:'Vençuda',n:pending.filter(x=>x.o.cd&&x.late>0).length}];const fam=Object.entries(SUP).map(([id,p])=>({id,p,amount:O.filter(o=>o.s===id).reduce((a,o)=>a+openAmount(o),0)})).sort((a,b)=>b.amount-a.amount);const max=Math.max(...fam.map(f=>f.amount),1);return head('Informes de compres','Indicadors calculats sobre les 20 comandes de demostració. Imports sense IVA.')+`<div class="grid k4"><div class="card metric"><span>Import pendent de rebre</span><b>${euro(amount)}</b><small>${pending.length} línies obertes</small></div><div class="card metric"><span>Material vençut</span><b>${euro(pending.filter(x=>x.late>0).reduce((a,x)=>a+x.amount,0))}</b><small>${pending.filter(x=>x.late>0).length} línies</small></div><div class="card metric"><span>Sense confirmació</span><b>${pending.filter(x=>!x.o.cd).length}</b><small>Pendent de resposta de proveïdor</small></div><div class="card metric"><span>Recepcions en aquesta sessió</span><b>${db.receipts.length}</b><small>Moviments locals registrats</small></div></div><div class="grid two" style="margin-top:16px"><div class="card"><div class="section-heading"><h2>Exposició per proveïdor</h2><button class="text-btn" onclick="exportLines()">Exporta dades</button></div>${fam.map(f=>`<div class="hbar"><div><button class="text-btn" onclick="supplier('${f.id}')">${f.p.n}</button><b>${euro(f.amount)}</b></div><div class="bar"><i style="width:${100*f.amount/max}%"></i></div></div>`).join('')}</div><div class="card"><h2>Estat de les línies obertes</h2>${donut(data)}<div class="callout">Una línia sense confirmar té prioritat de seguiment encara que la data prevista no hagi vençut. Els imports no són estalvis estimats.</div><h3>Metodologia</h3><p class="small mut">Pendent = quantitat demanada menys rebuda. Import pendent = pendent × preu unitari de mostra. Vençuda = data confirmada, o prevista si falta, anterior al 13/11/2026.</p></div></div>`}

reviewMail=function(id){const m=MAIL.find(m=>m.id===id),o=O.find(o=>o.id===m.o);document.getElementById('pn').innerHTML=`<button class="x" onclick="closeD()">×</button><div class="eyebrow">REVISIÓ DE CONFIRMACIÓ</div><h2>${m.o}</h2><div class="pill-line"><span class="tag t-amb">Decisió pendent</span><span>${SUP[o.s].n}</span></div><div class="evidence"><small>CORREU DE MOSTRA · ${m.when}</small><b>${m.subj}</b><small>${m.from}</small><p>${m.body}</p></div><h3>Comparació amb la comanda</h3><div class="comparison"><div><small>Data promesa</small><b>${fmt(o.pd)}</b></div><span>→</span><div><small>Proposta del proveïdor</small><b>${fmt(o.cd||o.pd)}</b></div></div><div class="diff">${m.diff.join('<br>')}</div><h3>Impacte en el client</h3><div class="callout">${o.imp==='—'?'Sense reserva de client assignada a la mostra.':o.imp}</div><label class="field">Resposta del comprador<select id="decision"><option value="accept">Acceptar proposta (simulació)</option><option value="reject">Rebutjar i preparar reclamació</option><option value="counter">Proposar una data alternativa</option></select></label><label class="field">Data alternativa (si escau)<input id="altdate" type="date"></label><label class="field">Nota interna<textarea id="decision-note" style="min-height:75px"></textarea></label><p id="decision-error" class="error"></p><div class="callout small">La decisió es registra a l'historial local. No s'envia cap resposta ni s'escriu a l'ERP.</div><div class="act"><button class="btn" onclick="decideMail('${m.id}')">Confirma decisió de mostra</button><button class="btn ghost" onclick="openO('${m.o}')">Obrir comanda</button></div>`;document.getElementById('dr').classList.add('on')};

 document.getElementById('pn').innerHTML=`<button class="x" onclick="closeD()">×</button><div class="eyebrow">COMANDA A PROVEÏDOR</div><h2>${id}</h2><div class="pill-line">${tag(o)}<button class="text-btn" onclick="supplier('${o.s}')">${SUP[o.s].n}</button></div><div class="order-overview"><div><small>COMPRADOR</small><b>${SUP[o.s].c}</b></div><div><small>EMESA</small><b>${fmt(o.od)}</b></div><div><small>PROMESA</small><b>${fmt(o.pd)}</b></div><div><small>CONFIRMADA</small><b>${fmt(o.cd)}</b></div></div><div class="callout"><b>Impacte:</b> ${o.imp==='—'?'Reposició d\'estoc':o.imp}</div><div class="tabs">${[['linies','Línies'],['historial','Historial'],['font','Correus / evidència']].map(([k,t])=>`<button class="tab ${tab===k?'on':''}" onclick="openO('${id}','${k}')">${t}</button>`).join('')}</div>${tab==='historial'?htab:tab==='font'?etab:ltab}<div class="drawer-footer"><button class="btn" onclick="claim('${id}')">Prepara reclamació</button><button class="btn ghost" onclick="receive('${id}')">Registra recepció</button></div>`;document.getElementById('dr').classList.add('on')};
const oldBind=bind;
bind=function(){oldBind();document.querySelectorAll('[data-lv]').forEach(e=>e.onclick=()=>{state.lineView=e.dataset.lv;render()});const q=document.getElementById('lq');if(q)q.oninput=()=>{state.lineQ=q.value;const pos=q.selectionStart;render();const n=document.getElementById('lq');n.focus();n.setSelectionRange(pos,pos)};[['lsup','lineSupplier'],['lbuy','lineBuyer'],['sort-lines','sort']].forEach(([id,k])=>{const e=document.getElementById(id);if(e)e.onchange=()=>{state[k]=e.value;render()}});const sl=document.getElementById('select-lines');if(sl)sl.onchange=()=>document.querySelectorAll('[data-linepick]').forEach(e=>e.checked=sl.checked);const sv=document.getElementById('view-saved');if(sv)sv.onchange=()=>{const v=sv.value===''?null:db.views[Number(sv.value)];if(v){['lineView','lineQ','lineSupplier','lineBuyer','sort'].forEach(k=>state[k]=v[k]);render()}};};
render=function(){nav();document.getElementById('view').innerHTML=({inici,comandes,linies,bustia,excepcions,proveidors,recepcions,reclamacions,informes,connexions}[state.route]||linies)();bind();const search=document.getElementById('global-q');if(search)search.onkeydown=e=>{if(e.key==='Enter'){state.lineQ=search.value;state.lineView='all';go('linies')}}};

const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))state.route=h;
render();if(h.startsWith('o:'))openO(h.slice(2));
</script>
</body></html>
